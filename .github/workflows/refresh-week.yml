name: Weekly data refresh

# Runs `npm run refresh:week` twice a week and pushes regenerated
# public/data/** straight to main (Vercel auto-deploys on push).
#
# --- BST/GMT handling (read before touching the cron lines) -----------------
# GitHub Actions cron is UTC only — there is no Europe/London option. 08:00
# Europe/London is 07:00 UTC in BST (late Mar - late Oct) and 08:00 UTC in
# GMT (late Oct - late Mar), so a single cron entry would silently fire an
# hour off for half the year. Fix used here: schedule BOTH possible UTC times
# for each target weekday (4 cron entries total, 2 per day). There is no
# runtime gate deciding which one is "correct" for today's DST state — both
# just run `refresh:week` unconditionally, and the no-op commit guard at the
# bottom (`git diff --cached --quiet`) makes the redundant second run of the
# day a harmless no-op commit-wise (it still does the full nflverse/odds
# pull and re-derives everything, but pushes nothing when nothing changed).
# This self-adjusts across every future clock change with no maintenance.
#
# --- Why no exact-time gate (history, see repo docs) -------------------------
# An earlier version of this workflow had a first step that checked the
# runner's actual Europe/London wall-clock hour and skipped every step
# except itself unless it was exactly 08:00 local. That's fragile against
# GitHub's own documented scheduling behaviour: `schedule` triggers are
# best-effort and can be delayed (GitHub's docs specifically flag the top of
# every hour — where every cron entry here used to fire — as the highest-
# congestion, highest-delay-risk time). A run that got delayed past its own
# target hour would have its gate correctly, but uselessly, skip the entire
# job — Checkout, npm ci, the real refresh, the commit — while still
# reporting a green "Success", which is invisible unless someone inspects
# run duration or per-step conclusions. That happened in practice: one
# scheduled run completed in 9 seconds having done nothing. Removing the
# gate trades "runs at exactly 08:00" for "definitely runs, twice a week,
# whenever GitHub gets to it" — a better trade given the no-op guard already
# makes over-running harmless. The cron minute is also offset off :00 (see
# below) to reduce the chance of the delay in the first place.
on:
  schedule:
    # Tuesday ~08:00 Europe/London (BST + GMT variants; no gate, see above)
    - cron: "17 7 * * 2"  # BST (UTC+1)
    - cron: "17 8 * * 2"  # GMT (UTC+0)
    # Friday ~08:00 Europe/London (BST + GMT variants; no gate, see above)
    - cron: "17 7 * * 5"  # BST (UTC+1)
    - cron: "17 8 * * 5"  # GMT (UTC+0)
  workflow_dispatch: {} # manual test-run trigger, see repo docs for how to fire it

# Never let two runs race each other's commit/push (the same-day BST/GMT
# pair, or a manual dispatch landing mid-schedule-run) — queue instead of
# overlapping.
concurrency:
  group: refresh-week
  cancel-in-progress: false

# The default GITHUB_TOKEN is read-only unless a workflow asks for more —
# this is the one write this workflow needs (pushing the data commit).
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # actions/checkout leaves a detached HEAD by default. refresh_week.ts
      # runs `git pull` as its own first step, which fails outright on a
      # detached HEAD ("you are not currently on a branch") — so land on a
      # real local branch before anything else runs.
      - name: Ensure a real branch checkout (not detached HEAD)
        run: git checkout -B main origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # matches this machine's local dev/build Node (no engines field in package.json to pin from — flagged in the design report)
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pinned — nfl_data_py's pandas<2/numpy<2 pins have no 3.12+ wheels (ingest/requirements.txt)

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r ingest/requirements.txt

      # ingest/pull_odds.mjs (invoked by refresh:week) is hardcoded to load
      # `node --env-file=.env.local` and reads THE_ODDS_API_KEY from
      # process.env — the same env var name, just sourced from a GitHub
      # secret instead of the gitignored local file. Written fresh into the
      # ephemeral runner's workspace each run; never committed (.env* is
      # already gitignored as belt-and-braces).
      - name: Write .env.local from the odds API secret
        run: echo "THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}" > .env.local

      - name: Configure git identity for the automated commit
        run: |
          git config user.name "nfl-explorer-bot"
          git config user.email "actions@users.noreply.github.com"

      # No `continue-on-error`, no `|| true` — if any step inside refresh:week
      # throws (a bad API response, a missing file, an nflverse pull
      # failure), this step fails, the job stops here, and NOTHING below it
      # (commit/push) runs. A failed run shows red in the Actions tab; it
      # never pushes a half-written dataset.
      - name: Run weekly refresh
        run: npm run refresh:week

      # Scoped to exactly the directory refresh:week writes to — never a
      # blanket `git add -A`/`git add .`. See the design report for the full
      # list of files this touches under public/data/. This guard is what
      # makes the same-day BST/GMT re-run (and any other redundant run)
      # harmless: real work happens either way, but nothing is pushed unless
      # something actually changed.
      - name: Commit and push public/data changes
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to public/data this run — nothing to commit."
          else
            git commit -m "Automated refresh [skip ci]"
            git push
          fi
